<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supplement-Wiki – was im Körper wirklich passiert</title>
    <meta name="description" content="Supplemente für den Ausdauersport: Wirkmechanismus in 3D, Einnahme, Anbieter, Studienlage und Empfehlung." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23060a13' stroke='%2335e0c8' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2335e0c8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="dist/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="kopf">
        <div class="marke">
          <span class="marke__zeichen" aria-hidden="true"></span>
          <div>
            <p class="marke__name">Supplement-Wiki</p>
            <p class="marke__sub">Ausdauersport · was in der Zelle wirklich passiert</p>
          </div>
        </div>
        <label class="gewicht">
          <span>Dein Gewicht</span>
          <input id="gewicht" type="number" inputmode="numeric" min="40" max="130" step="1" value="75" />
          <span>kg</span>
        </label>
      </header>

      <nav class="menue" id="menue" aria-label="Supplement auswählen"></nav>

      <main class="inhalt" id="inhalt"></main>

      <footer class="fuss">
        <p>
          Kein medizinischer Rat. Supplemente erst im Training testen; im Wettkampfsport nur chargengeprüfte Produkte
          (z. B. Kölner Liste, Informed Sport). Preise: Momentaufnahme <span id="preisstand"></span>.
        </p>
      </footer>
    </div>
    <script src="dist/app.js"></script>
  </body>
</html>
